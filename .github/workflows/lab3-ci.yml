# =============================================================================
# Lab 3 CI - monorepo entry point
# DDM501 - Lab 3: Testing & CI/CD
#
# GitHub Actions only executes workflows found in `.github/workflows/` at the
# ROOT of the repository. The lab's own copy lives at
# `Lab02.1/ddm501-lab3-starter/.github/workflows/ci.yml` (which is what runs if
# that folder is pushed as a standalone repo); this file is the version that
# actually runs in this monorepo. Keep the two in sync.
# =============================================================================

name: Lab3 CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Lab02.1/ddm501-lab3-starter/**"
      - ".github/workflows/lab3-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Lab02.1/ddm501-lab3-starter/**"
      - ".github/workflows/lab3-ci.yml"
  workflow_dispatch:

concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LAB_DIR: Lab02.1/ddm501-lab3-starter

defaults:
  run:
    working-directory: Lab02.1/ddm501-lab3-starter

jobs:
  # ===========================================================================
  # Linting
  # ===========================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0 black==23.12.1 isort==5.13.2

      - name: Run flake8
        run: flake8 app/ tests/ scripts/ training/

      - name: Check black formatting
        run: black --check --diff app/ tests/ scripts/ training/

      - name: Check import sorting
        run: isort --check-only --diff app/ tests/ scripts/ training/

  # ===========================================================================
  # Type checking
  # ===========================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        # Derived from requirements.txt rather than hand-listed, so a new
        # runtime dependency can never again be missing here. It was: adding
        # redis for the prediction cache left mypy unable to resolve the import,
        # and --ignore-missing-imports does not cover it (typeshed knows a
        # types-redis package exists, so mypy reports import-untyped anyway).
        #
        # scikit-surprise is the one exclusion: a slow source build, imported
        # lazily inside scripts/train_model.py, and with no typeshed stubs - so
        # --ignore-missing-imports genuinely does silence it.
        run: |
          python -m pip install --upgrade pip
          grep -v '^scikit-surprise' requirements.txt > /tmp/requirements-typecheck.txt
          pip install -r /tmp/requirements-typecheck.txt
          # pandas-stubs is pinned: it is the type checker's view of pandas, so
          # an unpinned release can turn the build red with no code change.
          # The pin must also install on this job's Python (3.10, the minimum
          # this project supports) - pandas-stubs 3.x requires >= 3.11, so 2.3.x
          # is the newest usable line here.
          pip install mypy==1.8.0 types-requests pandas-stubs==2.3.3.260113

      - name: Run mypy
        run: mypy app/ training/ scripts/ --ignore-missing-imports

  # ===========================================================================
  # Tests
  # ===========================================================================
  test:
    name: Run Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, type-check]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    # A real Redis so the cache round-trip tests actually run instead of
    # skipping. The API never requires it - the cache fails open - but an
    # untested cache is a cache nobody should trust.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache MovieLens dataset
        uses: actions/cache@v6
        with:
          path: ~/.surprise_data
          key: movielens-100k-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Train model
        run: python scripts/train_model.py --backend auto --cv 3

      - name: Validate model quality
        run: python scripts/validate_model.py

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --junitxml=junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            Lab02.1/ddm501-lab3-starter/htmlcov/
            Lab02.1/ddm501-lab3-starter/coverage.xml
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: Lab02.1/ddm501-lab3-starter/junit.xml
          retention-days: 14

      - name: Upload trained model
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: trained-model
          path: Lab02.1/ddm501-lab3-starter/models/
          retention-days: 7

  # ===========================================================================
  # Docker build + smoke test
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v7

      - name: Download trained model
        uses: actions/download-artifact@v8
        with:
          name: trained-model
          path: Lab02.1/ddm501-lab3-starter/models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: Lab02.1/ddm501-lab3-starter
          push: false
          load: true
          tags: movie-rating-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d -p 8000:8000 --name ci-api movie-rating-api:ci
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | tee health.json
          grep -q '"model_loaded":true' health.json
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"user_id":"196","movie_id":"242"}' | tee predict.json
          grep -q 'predicted_rating' predict.json

      - name: Dump container logs on failure
        if: failure()
        run: docker logs ci-api

      - name: Stop container
        if: always()
        run: docker rm -f ci-api || true

  # ===========================================================================
  # Aggregate status
  # ===========================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build]
    if: always()

    # This job never checks the repo out, so the workflow-level
    # working-directory (the lab folder) would not exist and bash would fail to
    # start - masking the very failure this job exists to report.
    defaults:
      run:
        working-directory: .

    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed."
          exit 1

      - name: Report success
        run: echo "All CI checks passed."
