# =============================================================================
# Lab 3 CD - monorepo entry point
#
# GitHub only discovers workflows under the repository-root .github/workflows
# directory. Keep the standalone lab copy in
# Lab02.1/ddm501-lab3-starter/.github/workflows/cd.yml in sync with this file.
# =============================================================================

name: Lab3 CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (for example v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  LAB_DIR: Lab02.1/ddm501-lab3-starter
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

defaults:
  run:
    working-directory: Lab02.1/ddm501-lab3-starter

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            Lab02.1/ddm501-lab3-starter/requirements.txt
            Lab02.1/ddm501-lab3-starter/requirements-dev.txt

      - name: Cache MovieLens dataset
        uses: actions/cache@v6
        with:
          path: ~/.surprise_data
          key: movielens-100k-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Train model
        run: python scripts/train_model.py --backend auto --cv 3

      - name: Validate model quality
        run: python scripts/validate_model.py

      - name: Run full test suite
        run: pytest tests/ -v --cov=app --cov-fail-under=80

      - name: Upload release model
        uses: actions/upload-artifact@v7
        with:
          name: release-model
          path: Lab02.1/ddm501-lab3-starter/models/
          retention-days: 30

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [verify]

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release model
        uses: actions/download-artifact@v8
        with:
          name: release-model
          path: Lab02.1/ddm501-lab3-starter/models/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api
            ghcr.io/${{ github.repository }}/movie-rating-api
          tags: |
            type=semver,value=${{ env.RELEASE_VERSION }},pattern={{version}}
            type=semver,value=${{ env.RELEASE_VERSION }},pattern={{major}}.{{minor}}
            type=semver,value=${{ env.RELEASE_VERSION }},pattern={{major}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: Lab02.1/ddm501-lab3-starter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          body: |
            ## Movie Rating Prediction API ${{ env.RELEASE_VERSION }}

            Published images:
            - `${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ env.RELEASE_VERSION }}`
            - `ghcr.io/${{ github.repository }}/movie-rating-api:${{ env.RELEASE_VERSION }}`

            Digest: `${{ steps.build.outputs.digest }}`
          draft: false
          prerelease: ${{ contains(env.RELEASE_VERSION, '-rc') }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: staging
      url: https://staging.movie-rating-api.example.com

    steps:
      - name: Deploy
        working-directory: .
        run: |
          echo "Deploying ${{ env.RELEASE_VERSION }} to staging..."
          echo "Image digest: ${{ needs.build-and-push.outputs.image-digest }}"

      - name: Smoke test staging
        working-directory: .
        run: |
          echo "Checking /health on staging..."
          # Replace with: curl -sf https://staging.movie-rating-api.example.com/health

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
      url: https://movie-rating-api.example.com

    steps:
      - name: Deploy
        working-directory: .
        run: echo "Deploying ${{ env.RELEASE_VERSION }} to production..."

      - name: Smoke test production
        id: smoke
        working-directory: .
        run: |
          echo "Checking /health on production..."
          # Replace with: curl -sf https://movie-rating-api.example.com/health

      - name: Roll back on failure
        if: failure()
        working-directory: .
        run: |
          echo "Deployment failed - rolling back to the previous release..."
          # Replace with the rollback command for the chosen platform.
