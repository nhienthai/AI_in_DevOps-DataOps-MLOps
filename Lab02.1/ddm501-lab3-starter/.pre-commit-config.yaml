# =============================================================================
# Pre-commit hooks configuration
# DDM501 - Lab 3: Testing & CI/CD
#
# The hooks mirror the CI `lint` and `type-check` jobs, at the same pinned
# versions. That is the point: a commit that passes locally passes in CI, and a
# formatting disagreement between the two can never happen.
#
# Setup:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type pre-push
#
# Run manually:
#   pre-commit run --all-files
# =============================================================================

default_language_version:
  python: python3

repos:
  # ===========================================================================
  # Standard pre-commit hooks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ===========================================================================
  # Black formatter
  # ===========================================================================
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: ["--line-length=100"]

  # ===========================================================================
  # isort for import sorting
  # ===========================================================================
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]

  # ===========================================================================
  # Flake8 linter
  # ===========================================================================
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # Settings come from .flake8 so the hook and `flake8 .` agree.
        args: ["--config=.flake8"]

  # ===========================================================================
  # mypy type checker
  # ===========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        files: ^(app|training|scripts)/
        additional_dependencies:
          - types-requests
          - pydantic==2.5.2
        args: ["--ignore-missing-imports"]

  # ===========================================================================
  # Fast tests on commit, full suite on push
  # ===========================================================================
  - repo: local
    hooks:
      # Unit + data tests only: they need no model artifact and finish in
      # under a second, so the commit loop stays fast.
      - id: pytest-fast
        name: pytest (unit + data)
        entry: pytest tests/unit tests/data -q --no-cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # The full suite, including integration and behavioural tests, runs
      # before the code leaves the machine.
      - id: pytest-full
        name: pytest (full suite with coverage gate)
        entry: pytest tests/ -q --cov=app --cov-fail-under=80
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
