# =============================================================================
# CD Pipeline for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
#
# Triggered by a version tag (v1.0.0). Re-runs the full test suite, trains and
# validates a model, publishes a multi-arch image to Docker Hub and GHCR, then
# promotes staging -> production behind a manual approval gate.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKER_USERNAME, DOCKER_PASSWORD   - Docker Hub credentials (a token, not
#                                        the account password)
# GHCR uses the built-in GITHUB_TOKEN, no secret needed.
# =============================================================================

name: CD Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. v1.0.0)"
        required: true

permissions:
  contents: write # create GitHub releases
  packages: write # push to ghcr.io

jobs:
  # ===========================================================================
  # Gate: never ship an untested tag
  # ===========================================================================
  verify:
    name: Verify Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Cache MovieLens dataset
        uses: actions/cache@v6
        with:
          path: ~/.surprise_data
          key: movielens-100k-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Train model
        run: python scripts/train_model.py --backend auto --cv 3

      - name: Validate model quality
        run: python scripts/validate_model.py

      - name: Run full test suite
        run: pytest tests/ -v --cov=app --cov-fail-under=80

      - name: Upload release model
        uses: actions/upload-artifact@v7
        with:
          name: release-model
          path: models/
          retention-days: 30

  # ===========================================================================
  # Build and publish the image
  # ===========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [verify]

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release model
        uses: actions/download-artifact@v8
        with:
          name: release-model
          path: models/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Movie Rating Prediction API ${{ github.ref_name }}

            Published images:
            - `${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            Digest: `${{ steps.build.outputs.digest }}`

            All CI checks, the model quality gate and the full test suite
            passed before this image was published.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}

  # ===========================================================================
  # Deploy to staging
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: staging
      url: https://staging.movie-rating-api.example.com

    steps:
      - name: Deploy
        # Replace with the real deployment command for your platform, e.g.
        #   aws ecs update-service --cluster prod --service api --force-new-deployment
        #   kubectl set image deploy/api api=$IMAGE --namespace staging
        run: |
          echo "Deploying ${{ github.ref_name }} to staging..."
          echo "Image digest: ${{ needs.build-and-push.outputs.image-digest }}"

      - name: Smoke test staging
        run: |
          echo "Checking /health on staging..."
          # curl -sf https://staging.movie-rating-api.example.com/health

  # ===========================================================================
  # Deploy to production (requires manual approval on the 'production'
  # environment - configure reviewers in Settings > Environments)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
      url: https://movie-rating-api.example.com

    steps:
      - name: Deploy
        run: |
          echo "Deploying ${{ github.ref_name }} to production..."

      - name: Smoke test production
        id: smoke
        run: |
          echo "Checking /health on production..."
          # curl -sf https://movie-rating-api.example.com/health

      - name: Roll back on failure
        if: failure()
        # Rollback is a first-class step, not an afterthought: the image is
        # immutable and previous tags stay published, so reverting is a redeploy
        # of the prior tag.
        run: |
          echo "Deployment failed - rolling back to the previous release..."
          # kubectl rollout undo deploy/api --namespace production
