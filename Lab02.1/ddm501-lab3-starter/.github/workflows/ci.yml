# =============================================================================
# CI Pipeline for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
#
# Pipeline shape:
#
#   lint ─┐
#         ├─> test (3.10, 3.11) ─> model-validation ─> build
#   type ─┘
#
# Fast, cheap checks gate the slow ones: linting and type checking finish in
# seconds and stop a bad commit before anyone pays for a training run.
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run - no point paying for
# CI on a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.10"

jobs:
  # ===========================================================================
  # Linting Job
  # ===========================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0 black==23.12.1 isort==5.13.2

      - name: Run flake8
        run: flake8 app/ tests/ scripts/ training/

      - name: Check black formatting
        run: black --check --diff app/ tests/ scripts/ training/

      - name: Check import sorting
        run: isort --check-only --diff app/ tests/ scripts/ training/

  # ===========================================================================
  # Type Checking Job
  # ===========================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install dependencies
        # Derived from requirements.txt rather than hand-listed, so a new
        # runtime dependency can never again be missing here. It was: adding
        # redis for the prediction cache left mypy unable to resolve the import,
        # and --ignore-missing-imports does not cover it (typeshed knows a
        # types-redis package exists, so mypy reports import-untyped anyway).
        #
        # scikit-surprise is the one exclusion: a slow source build, imported
        # lazily inside scripts/train_model.py, and with no typeshed stubs - so
        # --ignore-missing-imports genuinely does silence it.
        run: |
          python -m pip install --upgrade pip
          grep -v '^scikit-surprise' requirements.txt > /tmp/requirements-typecheck.txt
          pip install -r /tmp/requirements-typecheck.txt
          # pandas-stubs is pinned: it is the type checker's view of pandas, so
          # an unpinned release can turn the build red with no code change.
          pip install mypy==1.8.0 types-requests pandas-stubs==3.0.5.260730

      - name: Run mypy
        run: mypy app/ training/ scripts/ --ignore-missing-imports

  # ===========================================================================
  # Test Job
  # ===========================================================================
  test:
    name: Run Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, type-check]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    # A real Redis so the cache round-trip tests actually run instead of
    # skipping. The API never requires it - the cache fails open - but an
    # untested cache is a cache nobody should trust.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache MovieLens dataset
        # ~5 MB download from grouplens.org; caching keeps CI independent of
        # that host being up and saves a download on every run.
        uses: actions/cache@v4
        with:
          path: ~/.surprise_data
          key: movielens-100k-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Train model
        # --backend auto uses scikit-surprise on Linux and falls back to the
        # NumPy implementation if the C extension is unavailable.
        run: python scripts/train_model.py --backend auto --cv 3

      - name: Validate model quality
        run: python scripts/validate_model.py

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --junitxml=junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: junit.xml
          retention-days: 14

      - name: Upload trained model
        # Hand the artifact to the build job so the image ships with a model
        # instead of rebuilding one.
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # Build Job
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: movie-rating-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # A build that succeeds but serves 503 is still a broken release, so the
        # check is on /health reporting a loaded model - not just on HTTP 200.
        run: |
          docker run -d -p 8000:8000 --name ci-api movie-rating-api:ci
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | tee health.json
          grep -q '"model_loaded":true' health.json

          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"user_id":"196","movie_id":"242"}' | tee predict.json
          grep -q 'predicted_rating' predict.json

      - name: Dump container logs on failure
        if: failure()
        run: docker logs ci-api

      - name: Stop container
        if: always()
        run: docker rm -f ci-api || true

  # ===========================================================================
  # Aggregate status - a single required check for branch protection
  # ===========================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build]
    if: always()

    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed."
          exit 1

      - name: Report success
        run: echo "All CI checks passed."
